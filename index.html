<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedEd Symposium</title>  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">  <style>
    :root{
      --bg:#0b1220;
      --card:#111827;
      --accent:#38bdf8;
      --accent2:#22c55e;
      --text:#e5e7eb;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: linear-gradient(180deg,#020617,#0b1220);
      color: var(--text);
    }

    header {
      text-align: center;
      padding: 18px;
      background: rgba(2,6,23,0.9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    header img {
      width: 90px;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(56,189,248,0.4);
    }

    h1 {
      margin: 8px 0 0 0;
      font-size: 22px;
      letter-spacing: 1px;
    }

    header input {
      margin-top: 12px;
      padding: 10px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      border: none;
      outline: none;
      background: #020617;
      color: white;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
      padding: 15px;
    }

    .card {
      background: var(--card);
      padding: 18px;
      border-radius: 18px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .card:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 15px 35px rgba(56,189,248,0.25);
      border-color: rgba(56,189,248,0.3);
    }

    .card:active {
      transform: scale(0.96);
    }

    textarea {
      width: 100%;
      height: 160px;
      margin-top: 10px;
      border-radius: 12px;
      padding: 12px;
      background: #020617;
      color: white;
      border: 1px solid rgba(255,255,255,0.1);
    }

    button {
      padding: 10px 14px;
      border-radius: 12px;
      border: none;
      margin-top: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .save {
      background: linear-gradient(90deg,#22c55e,#4ade80);
      color: black;
    }

    .back {
      background: linear-gradient(90deg,#38bdf8,#0ea5e9);
      color: black;
    }

  </style></head>
<body><header>
  <img src="logo.png">
  <h1>MedEd Symposium</h1>
  <p style="font-size:12px;opacity:0.7;">Premium Medical Learning</p>  <div style="margin-top:10px; display:flex; justify-content:center; gap:15px;">
    <a href="https://t.me/Mededsym" target="_blank" style="text-decoration:none; color:#38bdf8; font-weight:bold;">📢 Telegram</a>
    <a href="https://instagram.com/med.ed.symposium" target="_blank" style="text-decoration:none; color:#f472b6; font-weight:bold;">📸 Instagram</a>
  </div>  <input type="text" id="searchInput" placeholder="Search subjects..." oninput="search()">
</header><div id="home" class="container">
  <div class="card" onclick="openSection('general')">General</div>
  <div class="card" onclick="showSubjects('year1')">1st Year</div>
  <div class="card" onclick="showSubjects('year2')">2nd Year</div>
  <div class="card" onclick="showSubjects('year3')">3rd Year</div>
  <div class="card" onclick="showSubjects('year4')">4th Year</div>
  <div class="card" onclick="openSection('mcq')">MCQ</div>
  <div class="card" onclick="openSection('cases')">Cases</div>
</div><div id="content" style="display:none; padding:15px;"></div><script>

function showSubjects(year) {
  document.getElementById('home').style.display = 'none';

  let subjects = {
    year1: ['Anatomy','Physiology','Biochemistry'],
    year2: ['Pathology','Microbiology','Pharmacology'],
    year3: ['SPM','FMT','ENT','Ophthalmology'],
    year4: ['Medicine','Surgery','OBG','Paediatrics','Orthopaedics','Dermatology','Psychiatry','Radiology','Anaesthesia']
  };

  let html = `<h2>${year.toUpperCase()}</h2>
  <button class="back" onclick="goHome()">⬅ Back</button>`;

  subjects[year].forEach(sub => {
    html += `<div class="card" onclick="openSection('${year}-' + sub)">${sub}</div>`;
  });

  document.getElementById('content').style.display = 'block';
  document.getElementById('content').innerHTML = html;
}

function openSection(section) {
  document.getElementById('home').style.display = 'none';

  let notes = localStorage.getItem(section) || "";

  document.getElementById('content').style.display = 'block';
  document.getElementById('content').innerHTML = `
    <h2>${section}</h2>
    <button class="back" onclick="goHome()">⬅ Back</button>
    <textarea id="noteInput">${notes}</textarea><button class="save" onclick="saveNotes('${section}')">Save</button>

`; }

function saveNotes(section) { let data = document.getElementById('noteInput').value; localStorage.setItem(section, data); alert('Saved'); }

function goHome() { document.getElementById('home').style.display = 'grid'; document.getElementById('content').style.display = 'none'; }

function search() { let input = document.getElementById('searchInput').value.toLowerCase(); let cards = document.querySelectorAll('.card');

cards.forEach(card => { let text = card.innerText.toLowerCase(); card.style.display = text.includes(input) ? 'block' : 'none'; }); }

if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }

</script></body>
</html>
